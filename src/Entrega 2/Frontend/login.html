<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar — TrocaTicket</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/extras.css">
    </head>
    <body class="pagina-auth">
        <main class="auth-container">
            <form class="auth-card" novalidate>
                <div class="img-centralizada">
                    <img src="images/logo_trocaticket.png" width="150" height="150" alt="Logo da TrocaTicket">
                </div>

                <h2 class="auth-card_pergunta">Entrar na conta</h2>
                <p class="auth-card_descricao">
                    Acesse seus eventos, ingressos e pedidos.
                </p>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <p class="campo-sucesso" id="aviso-login" hidden></p>
                <p class="campo-erro" id="erro-login" hidden></p>

                <button type="submit" class="botao-principal">Entrar</button>

                <p class="auth-card_rodape">
                    Ainda não tem conta? <a href="cadastro.html"><strong>Criar conta</strong></a>
                </p>

            </form>
        </main>

        <script src="js/buttons.js"></script>
        <script src="js/autenticacao.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
